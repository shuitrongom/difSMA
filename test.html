<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acordeón dentro de dropdown - Bootstrap 5</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Permitir que el acordeón se expanda sin recortar dentro del dropdown */
    .dropdown-menu { overflow: visible; }
  </style>
</head>
<body class="p-5">

  <div class="dropdown">
    <!-- data-bs-auto-close="outside" evita que el dropdown se cierre al interactuar dentro -->
    <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownAccordionBtn"
            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
      Menú con acordeón
    </button>

    <div class="dropdown-menu p-3" aria-labelledby="dropdownAccordionBtn" style="min-width:320px;">
      <div class="accordion" id="dropdownAccordion">
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingOne">
            <button class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#collapseOne"
                    aria-expanded="false" aria-controls="collapseOne">
              Elemento 1
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#dropdownAccordion">
            <div class="accordion-body">
              Contenido del elemento 1. Puedes añadir formularios, enlaces u otros controles aquí.
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header" id="headingTwo">
            <button class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#collapseTwo"
                    aria-expanded="false" aria-controls="collapseTwo">
              Elemento 2
            </button>
          </h2>
          <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#dropdownAccordion">
            <div class="accordion-body">
              Contenido del elemento 2.
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header" id="headingThree">
            <button class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#collapseThree"
                    aria-expanded="false" aria-controls="collapseThree">
              Elemento 3
            </button>
          </h2>
          <div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#dropdownAccordion">
            <div class="accordion-body">
              Contenido del elemento 3.
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de ejemplo dentro del dropdown -->
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" type="button" onclick="document.getElementById('dropdownAccordionBtn').click()">Cerrar</button>
        <a href="#" class="btn btn-sm btn-primary">Acción</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle (incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
