<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel 3 imágenes Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Ajuste para que las imágenes ocupen todo el alto del slide */
    .carousel-item img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-light">

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-xl-3">
      <div id="multiCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="carouselContent"></div>
        <div class="carousel-inner" id="carouselContent"></div>
        <div class="carousel-inner" id="carouselContent"></div>

        <!-- Controles -->
        <button class="carousel-control-prev" type="button" data-bs-target="#multiCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#multiCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
  // Lista de imágenes
  const imagenes = [
    "img/noticias_1.png",
    "img/noticias_2.png",
    "img/noticias_3.png",
    "img/NoticiasIndex_1.jpg",
    "img/NoticiasIndex_2.jpg"
  ];

  const carouselContent = document.getElementById("carouselContent");
  const total = imagenes.length;
  const visibles = 3; // imágenes visibles por slide

  for (let i = 0; i < total; i++) {
    const item = document.createElement("div");
    item.classList.add("carousel-item");
    if (i === 0) item.classList.add("active");

    const flexBox = document.createElement("div");
    flexBox.classList.add("d-flex");

    for (let j = 0; j < visibles; j++) {
      const index = (i + j) % total; // rotación circular
      const img = document.createElement("img");
      img.src = imagenes[index];
      img.classList.add("d-block", "w-100");
      img.alt = `Imagen ${index + 1}`;
      flexBox.appendChild(img);
    }

    item.appendChild(flexBox);
    carouselContent.appendChild(item);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
